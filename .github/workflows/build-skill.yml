name: Validate Codex skill

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check generated bundle
        run: python3 build_skill.py --check
      - name: Test packaging and installed tools
        run: python3 -m unittest discover -s tests
